<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cài đặt — Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="admin-wrapper content-wrapper">
      <main class="admin-content">
        <h2>Cấu hình hệ thống</h2>

        <form id="form-settings" class="contract-form">
          <label>Tên cửa hàng</label>
          <input name="shopName" type="text" value="Cầm Không Hối Hận" />

          <label>Email liên hệ</label>
          <input name="email" type="email" value="support@camkhonghoihan.vn" />

          <label>Số điện thoại</label>
          <input name="phone" type="text" value="0909 123 456" />

          <label>Địa chỉ</label>
          <input
            name="address"
            type="text"
            value="123 Nguyễn Huệ, Q1, TP.HCM"
          />

          <button class="btn" type="submit">Lưu cài đặt</button>
          <p id="settings-msg" class="message"></p>
        </form>
      </main>
    </div>

    <script src="admin-final.js"></script>

  </body>
</html>
