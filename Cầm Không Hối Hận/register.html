<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Đăng ký hợp đồng — Hiệu cầm đồ Cầm Không Hối Hận</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="public.css" />
  </head>
  <script src="app-core.js"></script>
  <script src="app-pages.js"></script>
  <body>
    <div class="header">
      <div class="container"><h1>Đăng ký hợp đồng</h1></div>
    </div>
<div class="container navbar">
        <a href="index.html" class="btn" >Trang chủ</a>
        <a href="home.html" class="btn" class="active">Giới thiệu</a>
        <a href="assets.html" class="btn">Loại tài sản</a>
        <a href="register.html" class="btn">Đăng kí hợp đồng</a>
        <a href="lookup.html" class="btn">Tra cứu hợp đồng</a>
        <a href="contact.html" class="btn">Liên hệ</a>
    <main class="container">
      <div class="form" role="form" aria-label="Form đăng ký">
        <form action="#" method="post">
          <label>Họ tên</label>
          <input name="fullname" placeholder="Nguyễn Văn A" required />

          <label>CMND/CCCD</label>
          <input name="id_number" required />

          <label>Số điện thoại</label>
          <input name="phone" required />

          <label>Loại tài sản</label>
          <select name="item_type" required>
            <option value="">-- Chọn --</option>
            <option>Ô tô</option>
            <option>Xe máy</option>
            <option>Sổ đỏ</option>
            <option>Điện thoại</option>
            <option>Trang sức</option>
            <option>Laptop</option>
            <option>Khác</option>
          </select>

          <label>Mô tả tài sản</label>
          <textarea name="item_desc" rows="4"></textarea>

          <label>Giá trị thỏa thuận (VNĐ)</label>
          <input name="principal" type="number" min="0" required />

          <button class="btn" type="submit">Gửi đăng ký</button>
        </form>
      </div>

      <p class="small" style="margin-top: 12px">
        Sau khi gửi, nhân viên sẽ gọi xác nhận. Mang theo CMND/CCCD khi đến cửa
        hàng.
      </p>
    </main>
  </body>
</html>
